<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Four abstract expert panel cards arranged in a row, connected by a dashed line">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#a54f35" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#a54f35" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#f7f1e6" />
  <rect width="1280" height="720" fill="url(#glow)" />

  <!-- connecting line suggesting a panel / roundtable -->
  <line x1="205" y1="270" x2="1075" y2="270" stroke="#a54f35" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.55" />

  <!-- four expert cards -->
  <g>
    <!-- card 1 -->
    <rect x="75" y="190" width="260" height="340" rx="16" fill="#fcf6ed" stroke="#e2d6c3" stroke-width="1.5" />
    <circle cx="205" cy="270" r="38" fill="#a54f35" />
    <text x="205" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#fcf6ed" text-anchor="middle">N</text>
    <rect x="145" y="342" width="120" height="12" rx="6" fill="#3b2e22" opacity="0.85" />
    <rect x="160" y="368" width="90" height="9" rx="4.5" fill="#7a6a57" opacity="0.7" />
    <rect x="120" y="410" width="160" height="7" rx="3.5" fill="#e2d6c3" />
    <rect x="120" y="430" width="140" height="7" rx="3.5" fill="#e2d6c3" />
    <rect x="120" y="450" width="150" height="7" rx="3.5" fill="#e2d6c3" />
  </g>

  <g>
    <!-- card 2 -->
    <rect x="365" y="190" width="260" height="340" rx="16" fill="#fcf6ed" stroke="#e2d6c3" stroke-width="1.5" />
    <circle cx="495" cy="270" r="38" fill="#a54f35" />
    <text x="495" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#fcf6ed" text-anchor="middle">E</text>
    <rect x="435" y="342" width="120" height="12" rx="6" fill="#3b2e22" opacity="0.85" />
    <rect x="450" y="368" width="90" height="9" rx="4.5" fill="#7a6a57" opacity="0.7" />
    <rect x="410" y="410" width="160" height="7" rx="3.5" fill="#e2d6c3" />
    <rect x="410" y="430" width="140" height="7" rx="3.5" fill="#e2d6c3" />
    <rect x="410" y="450" width="150" height="7" rx="3.5" fill="#e2d6c3" />
  </g>

  <g>
    <!-- card 3 -->
    <rect x="655" y="190" width="260" height="340" rx="16" fill="#fcf6ed" stroke="#e2d6c3" stroke-width="1.5" />
    <circle cx="785" cy="270" r="38" fill="#a54f35" />
    <text x="785" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#fcf6ed" text-anchor="middle">S</text>
    <rect x="725" y="342" width="120" height="12" rx="6" fill="#3b2e22" opacity="0.85" />
    <rect x="740" y="368" width="90" height="9" rx="4.5" fill="#7a6a57" opacity="0.7" />
    <rect x="700" y="410" width="160" height="7" rx="3.5" fill="#e2d6c3" />
    <rect x="700" y="430" width="140" height="7" rx="3.5" fill="#e2d6c3" />
    <rect x="700" y="450" width="150" height="7" rx="3.5" fill="#e2d6c3" />
  </g>

  <g>
    <!-- card 4 -->
    <rect x="945" y="190" width="260" height="340" rx="16" fill="#fcf6ed" stroke="#e2d6c3" stroke-width="1.5" />
    <circle cx="1075" cy="270" r="38" fill="#a54f35" />
    <text x="1075" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#fcf6ed" text-anchor="middle">V</text>
    <rect x="1015" y="342" width="120" height="12" rx="6" fill="#3b2e22" opacity="0.85" />
    <rect x="1030" y="368" width="90" height="9" rx="4.5" fill="#7a6a57" opacity="0.7" />
    <rect x="990" y="410" width="160" height="7" rx="3.5" fill="#e2d6c3" />
    <rect x="990" y="430" width="140" height="7" rx="3.5" fill="#e2d6c3" />
    <rect x="990" y="450" width="150" height="7" rx="3.5" fill="#e2d6c3" />
  </g>

  <!-- small dots under each avatar to suggest a speaking indicator -->
  <circle cx="205" cy="230" r="4" fill="#a54f35" opacity="0.5" />
  <circle cx="495" cy="230" r="4" fill="#a54f35" opacity="0.5" />
  <circle cx="785" cy="230" r="4" fill="#a54f35" opacity="0.5" />
  <circle cx="1075" cy="230" r="4" fill="#a54f35" opacity="0.5" />
</svg>
